<h1>Cadastro de Funcionário</h1>
    <form action="#">
        <h2>Preencha os dados do Funcionário</h2>

        <p><label for="nome">Nome</label><br>
        <input type="text" placeholder="Ex:Nome" name="nome" id="nome"></p>

        <p><label for="idade">Idade</label><br>
        <input type="number" placeholder="Ex:18" name="idade" id="idade"></p>

        <p><label for="dt-nasc">Data de nascimento</label><br>
        <input type="date" name="dt-nasc" id="dt-nasc"></p>

        <p><label for="email">E-mail</label><br>
        <input type="email" placeholder="Ex:nome@gmail.com" name="email" id="email"></p>

        <p><label for="senha">Senha</label><br>
        <input type="password" placeholder="Ex:123456" name="senha" id="senha"></p>

        <p><label for="idiomas">Idiomas</label>
        <input type="checkbox" name="idiomas" id="ingles">
            <label for="ingles">Inglês</label>
        <input type="checkbox" name="idiomas" id="pt-br">
            <label for="pt-br">Português</label>
        <input type="checkbox" name="idiomas" id="espanhol">
            <label for="espanhol">Espanhol</label></p>

       <p><label for="sexo">Sexo</label>
        <input type="radio" name="sexo" id="masculino">
            <label for="masculino">Masculino</label>
        <input type="radio" name="sexo" id="feminino">
            <label for="feminino">Feminino</label></p>

        <input type="reset" value="Resetar">
        <input type="submit" value="Enviar">
        
        <p><a href="index.html">Voltar para a lista</a></p>
        
    </form>
